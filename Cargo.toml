[package]
name = "arkhe"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Deterministic variable-width modular circuit simulator and yardstick for axiomatic neurogenesis"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Shapedsundew9/arkhe"
build = "scripts/build.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rand = { version = "0.10.3", default-features = false, features = ["std"] }
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

[lib]
name = "arkhe"
path = "src/lib.rs"

[[bin]]
name = "arkhe"
path = "src/main.rs"
